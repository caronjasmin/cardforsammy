<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Boyfriend's Day</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffc8dd;--hot:#ff6fa5;--lav:#cdb4ff;--sky:#bde0fe;--butter:#fff1a8;--ink:#5b3a56;--paper:#fffdf7;--bg:#ffe5f0;--grid:#ffd0e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1b2e;--grid:#3b2640}}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:28px 28px;font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;overflow-x:hidden}
.fl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl span{position:absolute;bottom:-40px;opacity:.7;animation:up 10s linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.title{font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:1.6rem;color:var(--hot);text-align:center;margin:0 0 4px;font-weight:600;letter-spacing:-.5px}
.sub{font-size:.95rem;font-weight:500;margin:0 0 22px;text-align:center}
.env{position:relative;width:min(310px,82vw);height:205px;cursor:pointer;transition:opacity .6s,transform .6s;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) translateY(-5px)}}
.env.open{animation:none}
.env.gone{opacity:0;transform:translateY(40px);pointer-events:none;position:absolute}
.back{position:absolute;inset:0;background:var(--lav);border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink)}
.peek{position:absolute;left:14px;right:14px;top:14px;height:165px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;transition:transform .9s .5s}
.env.open .peek{transform:translateY(-95px)}
.front{position:absolute;inset:0;background:var(--pink);border-radius:12px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:115px;background:var(--hot);transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:84px;font-size:36px;z-index:4;transform:translateX(-50%);animation:beat 1.1s infinite}
.env.open .seal{opacity:0}
@keyframes beat{50%{transform:translateX(-50%) scale(1.25)}}
.tap{margin-top:22px;font-size:.95rem;font-weight:500;background:var(--butter);border:3px solid var(--ink);border-radius:20px;padding:2px 16px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
#card{display:none;position:relative;width:min(440px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:34px 22px 26px;color:#5b3a56;animation:rise 1s both;margin:20px 0}
#card.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(90px) scale(.9)}to{opacity:1;transform:none}}
.tape{position:absolute;top:-14px;left:50%;width:110px;height:28px;background:repeating-linear-gradient(45deg,#ffd6e8 0 8px,#fff 8px 16px);opacity:.9;transform:translateX(-50%) rotate(-3deg);border:2px dashed #e7a;}
#card h2{font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:-.5px;font-size:1.5rem;text-align:center;margin:0 0 16px;color:var(--hot)}
.pics{display:flex;flex-direction:column;align-items:center;gap:22px;margin-bottom:22px}
.pol{position:relative;background:#fff;border:2px solid var(--ink);padding:7px 7px 6px;box-shadow:3px 3px 0 var(--ink);text-align:center;font-size:.85rem;font-weight:500;width:46%}
.pol:first-child{transform:rotate(-4deg)}.pol:last-child{transform:rotate(4deg)}
.pol label{display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:var(--sky);cursor:pointer;overflow:hidden;font-size:.9rem;text-align:center}
.pol img{width:100%;height:100%;object-fit:cover}
.pol input{display:none}
.st{position:absolute;font-size:26px}
.letter{line-height:1.65;font-size:1rem}
.letter p{margin:0 0 14px}
.sign{text-align:right;color:var(--hot);font-weight:600;font-size:1rem}

.ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 35%}
.cap{font-family:'Grand Hotel','Brush Script MT',cursive;font-size:1.5rem;color:var(--hot);padding-top:6px}
.cap2{font-size:.8rem;font-weight:500;padding-bottom:2px}
.tw{position:absolute;font-style:normal;font-size:24px;color:#ff8fb8;animation:tw 1.6s ease-in-out infinite;z-index:2}
@keyframes tw{0%,100%{transform:scale(.5) rotate(0);opacity:.4}50%{transform:scale(1.3) rotate(25deg);opacity:1}}
.mas{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 16px}
.face{font-size:1.5rem;animation:hop 1s ease-in-out infinite;display:inline-block}
@keyframes hop{50%{transform:translateY(-10px) rotate(-6deg)}}
.bub{font-family:'Inter',sans-serif;font-weight:600;font-size:.85rem;background:var(--butter);border:2px solid var(--ink);border-radius:12px;padding:2px 10px;animation:pop 1.2s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.15) rotate(-4deg)}}
.rays{position:fixed;inset:-50%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.9) 0 3deg,transparent 3deg 9deg);z-index:0}
.rays.go{animation:rays 1.1s ease-out}
@keyframes rays{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.4) rotate(12deg)}}
#card,.env,.title,.sub,.tap{z-index:1}
.pet{position:fixed;top:-30px;pointer-events:none;color:#ffb3cf;animation:fall 8s linear infinite;z-index:0}
@keyframes fall{to{transform:translate(60px,110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="fl" id="fl"></div>
<div class="title">you got mail</div>
<div class="sub">a little something for sammy</div>
<div class="env" id="env" onclick="openIt()">
  <div class="back"></div><div class="peek"></div><div class="front"></div><div class="flap"></div><div class="seal" style="color:#fff">♥</div>
</div>
<div class="tap" id="tap">tap to open</div>

<div id="card">
  <div class="tape"></div>
